#!/usr/sbin/nft -f

table inet netguard {
    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Allow HTTP traffic from LAN1 to Ubuntu Server
        ip saddr 192.168.10.0/24 ip daddr 192.168.20.10 tcp dport 80 ct state new accept

        # Log and drop unauthorized forwarded traffic
        limit rate 5/minute burst 5 packets log prefix "NETGUARD_DROP : " drop
    }
}
